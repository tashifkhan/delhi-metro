name: Publish to F-Droid repo

# Re-run or manually push an existing GitHub Release APK into
# https://tashif.codes/fdroid/repo without rebuilding.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag that contains the APK (e.g. v1.1.0)
        required: true
        type: string
      apk_pattern:
        description: APK asset pattern on that release
        required: true
        default: "DelhiMetro-v*.apk"
        type: string

permissions:
  contents: read

jobs:
  trigger-website-fdroid:
    name: Trigger tashif.codes F-Droid publish
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      APK_PATTERN: ${{ inputs.apk_pattern }}
      GH_TOKEN: ${{ secrets.TASHIF_CODES_WORKFLOW_TOKEN }}
      TASHIF_CODES_REPO: tashifkhan/tashif.codes
    steps:
      - name: Validate token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Missing secret TASHIF_CODES_WORKFLOW_TOKEN"
            echo "Create a fine-grained PAT with Actions: read/write on tashifkhan/tashif.codes"
            exit 1
          fi

      - name: Trigger tashif.codes workflow
        run: |
          set -euo pipefail
          gh workflow run publish-fdroid.yml \
            --repo "$TASHIF_CODES_REPO" \
            --field source_repository="${{ github.repository }}" \
            --field release_tag="$RELEASE_TAG" \
            --field apk_pattern="$APK_PATTERN"

          sleep 3
          RUN_URL="$(gh run list \
            --repo "$TASHIF_CODES_REPO" \
            --workflow=publish-fdroid.yml \
            --limit 1 \
            --json url \
            --jq '.[0].url' || true)"
          echo "Dispatched publish-fdroid.yml for $RELEASE_TAG ($APK_PATTERN)"
          [[ -n "${RUN_URL:-}" ]] && echo "Run: $RUN_URL"
