name: Build and Release APK

# Builds one APK per ARM ABI with EAS, attaches both to a GitHub Release,
# then dispatches the F-Droid publish workflow on tashif.codes.
#
# Required secrets:
#   EXPO_TOKEN                    — Expo account token for EAS builds
#   TASHIF_CODES_WORKFLOW_TOKEN   — PAT with actions:write on tashifkhan/tashif.codes.
#                                   The run fails without it, so a release can't
#                                   skip F-Droid and still pass.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      TASHIF_CODES_WORKFLOW_TOKEN: ${{ secrets.TASHIF_CODES_WORKFLOW_TOKEN }}
      TASHIF_CODES_REPO: tashifkhan/tashif.codes
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      # Fail before the EAS build. The F-Droid step used to be skipped when the
      # token was unset, which is how v1.7.0 released green but missed F-Droid.
      - name: Check F-Droid token
        run: |
          if [ -z "$TASHIF_CODES_WORKFLOW_TOKEN" ]; then
            echo "::error::TASHIF_CODES_WORKFLOW_TOKEN is not set on this repo."
            echo "Add a fine-grained PAT with Actions read/write on tashifkhan/tashif.codes."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install app dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Build and download ARM APKs
        working-directory: app
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a; do
            profile=github-release
            if [[ "$abi" == armeabi-v7a ]]; then
              profile=github-release-armeabi-v7a
            fi
            eas build --platform android --profile "$profile" --non-interactive --wait --json > "$RUNNER_TEMP/build-$abi.json"
            apk_url=$(node -e '
              const [build] = require(process.argv[1]);
              const url = build?.artifacts?.applicationArchiveUrl || build?.artifacts?.buildUrl;
              if (!url) throw new Error("EAS did not return an APK artifact URL");
              process.stdout.write(url);
            ' "$RUNNER_TEMP/build-$abi.json")
            curl --fail --location --retry 3 "$apk_url" -o "$RUNNER_TEMP/DelhiMetro-$RELEASE_TAG-$abi.apk"
          done
          mv "$RUNNER_TEMP/DelhiMetro-$RELEASE_TAG-"*.apk ..

      - name: Build release notes from CHANGELOG
        id: notes
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          {
            echo "## Delhi NCR Metro ${TAG}"
            echo ""
            echo "Production Android APKs built with EAS for arm64-v8a and armeabi-v7a."
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Package** | \`codes.tashif.delhimetro\` |"
            echo "| **Tag** | \`${TAG}\` |"
            echo ""
            if [[ -f CHANGELOG.md ]]; then
              # Extract the matching ## [x.y.z] section (Keep a Changelog).
              python3 - "$VERSION" CHANGELOG.md <<'PY'
          import re, sys
          version, path = sys.argv[1], sys.argv[2]
          text = open(path, encoding="utf-8").read()
          pattern = rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## |\Z)"
          match = re.search(pattern, text, flags=re.M | re.S)
          if not match:
              sys.exit(0)
          body = match.group(1).strip()
          if body:
              print("### Release notes")
              print()
              print(body)
              print()
          PY
            fi
            echo "### Install"
            echo ""
            echo "- **F-Droid (recommended):** add \`https://tashif.codes/fdroid/repo\` in F-Droid → Settings → Repositories, then install **Delhi NCR Metro**."
            echo "- **Direct APK:** download the arm64-v8a APK for most devices, or the armeabi-v7a APK for 32-bit ARM devices (enable “Install unknown apps” if prompted)."
            echo "- **Website:** https://tashif.codes/fdroid"
            echo "- **Full changelog:** https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md"
          } > "$NOTES_FILE"
          echo "path=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DelhiMetro-${{ github.ref_name }}-arm64-v8a.apk
            DelhiMetro-${{ github.ref_name }}-armeabi-v7a.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
          body_path: ${{ steps.notes.outputs.path }}
          name: Delhi NCR Metro ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger tashif.codes F-Droid publish
        env:
          GH_TOKEN: ${{ env.TASHIF_CODES_WORKFLOW_TOKEN }}
        run: |
          set -euo pipefail
          echo "Dispatching publish-fdroid.yml on $TASHIF_CODES_REPO for $RELEASE_TAG"
          gh workflow run publish-fdroid.yml \
            --repo "$TASHIF_CODES_REPO" \
            --field source_repository="${{ github.repository }}" \
            --field release_tag="$RELEASE_TAG" \
            --field apk_pattern="DelhiMetro-${RELEASE_TAG}-*.apk"

          sleep 3
          RUN_URL="$(gh run list \
            --repo "$TASHIF_CODES_REPO" \
            --workflow=publish-fdroid.yml \
            --limit 1 \
            --json url \
            --jq '.[0].url' || true)"
          if [[ -n "${RUN_URL:-}" ]]; then
            echo "F-Droid workflow: $RUN_URL"
            {
              echo "### F-Droid publish"
              echo "Triggered: $RUN_URL"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Summary
        run: |
          {
            echo "## Delhi Metro ${RELEASE_TAG}"
            echo ""
            echo "- arm64-v8a APK: \`DelhiMetro-${RELEASE_TAG}-arm64-v8a.apk\`"
            echo "- armeabi-v7a APK: \`DelhiMetro-${RELEASE_TAG}-armeabi-v7a.apk\`"
            echo "- Release: https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
            echo "- F-Droid page: https://tashif.codes/fdroid"
            echo "- F-Droid repo: https://tashif.codes/fdroid/repo"
          } >> "$GITHUB_STEP_SUMMARY"
