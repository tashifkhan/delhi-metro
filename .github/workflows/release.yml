name: Build and Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install

      - name: Build APK on EAS
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile github-release --non-interactive --wait

      - name: Resolve APK artifact URL
        id: apk
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          BUILDS_JSON=$(eas build:list --platform android --status finished --build-profile github-release --git-commit-hash "${GITHUB_SHA}" --limit 1 --non-interactive --json)
          APK_URL=$(echo "$BUILDS_JSON" | node -e "const fs = require('fs'); const data = JSON.parse(fs.readFileSync(0, 'utf8')); const build = Array.isArray(data) ? data[0] : null; if (!build) { console.error('No finished Android build found for this commit.'); process.exit(1); } const url = build?.artifacts?.applicationArchiveUrl || build?.artifacts?.buildUrl; if (!url) { console.error('No APK artifact URL found on the finished build.'); process.exit(1); } process.stdout.write(url);")
          echo "apk_url=${APK_URL}" >> "$GITHUB_OUTPUT"

      - name: Download APK
        run: curl -L "${{ steps.apk.outputs.apk_url }}" -o "DelhiMetro-${{ github.ref_name }}.apk"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: DelhiMetro-${{ github.ref_name }}.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
